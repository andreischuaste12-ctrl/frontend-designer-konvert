name: Validate skills and evaluations

on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'evaluations/**'
      - 'skills/audit-frontend-designer-konvert/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'skills/design-por-referencia-konvert/**'
      - '.github/**'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'evaluations/**'
      - 'skills/audit-frontend-designer-konvert/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'skills/design-por-referencia-konvert/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/validate-repository.mjs
      - run: node --test "scripts/*.test.mjs" "skills/audit-frontend-designer-konvert/tests/*.test.mjs"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --experimental-test-coverage --test "scripts/*.test.mjs" "skills/audit-frontend-designer-konvert/tests/*.test.mjs"

  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: skills/design-por-referencia-konvert
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: skills/design-por-referencia-konvert/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: skills/design-por-referencia-konvert
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/design-por-referencia-konvert/package-lock.json
      - run: npm ci
      - run: npm run setup:browser -- --with-deps
      - run: npm run test:smoke

  fixture-react:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evaluations/fixtures/react-tailwind
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evaluations/fixtures/react-tailwind/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build

name: Validate skills and evaluations

on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'evaluations/**'
      - 'skills/audit-frontend-designer-konvert/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'skills/design-por-referencia-konvert/**'
      - 'skills/create-frontend-from-zero-konvert/**'
      - '.github/**'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'evaluations/**'
      - 'skills/audit-frontend-designer-konvert/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'skills/design-por-referencia-konvert/**'
      - 'skills/create-frontend-from-zero-konvert/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-project.mjs

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/design-por-referencia-konvert/package-lock.json
      - run: npm ci
        working-directory: skills/design-por-referencia-konvert
      - run: npm run setup:browser -- --with-deps
        working-directory: skills/design-por-referencia-konvert
      # Measure the complete tooling suite, including browser paths, with unchanged thresholds.
      - run: npm run check:coverage

  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: skills/design-por-referencia-konvert
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: skills/design-por-referencia-konvert/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: skills/design-por-referencia-konvert
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/design-por-referencia-konvert/package-lock.json
      - run: npm ci
      - run: npm run setup:browser -- --with-deps
      - run: node ../../scripts/doctor.mjs --browser
      - run: npm run test:smoke

  fixture-react:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evaluations/fixtures/react-tailwind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evaluations/fixtures/react-tailwind/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build

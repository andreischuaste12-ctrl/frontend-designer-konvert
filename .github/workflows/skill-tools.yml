name: Validate reference design skill

on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'evaluations/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'skills/design-por-referencia-konvert/**'
      - '.github/workflows/skill-tools.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'evaluations/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'skills/design-por-referencia-konvert/**'
      - '.github/workflows/skill-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/validate-repository.mjs
      - run: node --test scripts/evaluate-routing.test.mjs

  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: skills/design-por-referencia-konvert
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: skills/design-por-referencia-konvert/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: skills/design-por-referencia-konvert
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/design-por-referencia-konvert/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke

name: Reference availability
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check catalog and study URLs without changing them
        shell: bash
        run: node scripts/check-reference-links.mjs >> "$GITHUB_STEP_SUMMARY"
